name: Phone Audit (Maestro · 실기기 화면)

# 실폰 화면 주행: debug APK를 Android 에뮬레이터에 깔고 Maestro로 탭·입력.
# 월간(매월 1일 06 KST) + 수동. web 회귀와 분리 (에뮬 1회 30~60분이라 월간).
on:
  schedule:
    - cron: "0 21 1 * *"
  workflow_dispatch:

concurrency:
  group: wws-phone
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 러너 내장 Android SDK 사용 (setup-android@v3는 node24 강제런타임에서 죽음)

      - name: Install
        run: npm ci

      - name: Prebuild + debug APK
        run: |
          npx expo prebuild --platform android --non-interactive --no-install
          chmod +x android/gradlew
          ./android/gradlew -p android assembleDebug --no-daemon

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          disk-size: 6G
          script: maestro test --app android/app/build/outputs/apk/debug/app-debug.apk .maestro/

      - name: Upload maestro results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wws-phone-${{ github.run_number }}
          path: ~/.maestro/tests/
          if-no-files-found: warn

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="📱 phone audit 실패 (${{ github.run_number }})"
          EXIST=$(gh issue list --search "$TITLE" --state open --json number --jq length)
          if [ "$EXIST" = "0" ]; then
            gh issue create --title "$TITLE" --label "auto-fix" --body "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — Maestro 실기기 주행 실패. 아티팩트 wws-phone-${{ github.run_number }} 확인."
          fi
